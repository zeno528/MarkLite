name: Pre-release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marklite-prerelease
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify successful main CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Select verified revision
        id: source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ($env:VERIFIED_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid verified revision: $env:VERIFIED_SHA"
          }
          "sha=$env:VERIFIED_SHA" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  release:
    name: Build and publish pre-release
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - name: Ensure verified revision is still current
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git fetch origin main --tags
          $mainSha = git rev-parse origin/main
          if ($mainSha -ne $env:VERIFIED_SHA) {
            throw "main changed after CI completed. The newer CI run will release the current revision."
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Increment patch version
        id: version
        run: |
          $root = $env:GITHUB_WORKSPACE
          $package = Get-Content -LiteralPath (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          $currentVersion = [string]$package.version
          if ($currentVersion -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
            throw "Unsupported version: $currentVersion"
          }

          $newVersion = '{0}.{1}.{2}' -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Update-Version([string]$path, [string]$oldText, [string]$newText) {
            $fullPath = Join-Path $root $path
            $content = [System.IO.File]::ReadAllText($fullPath)
            if (-not $content.Contains($oldText)) {
              throw "Version marker not found in $path"
            }
            [System.IO.File]::WriteAllText($fullPath, $content.Replace($oldText, $newText), $utf8NoBom)
          }

          Update-Version 'package.json' `
            ('"version": "{0}"' -f $currentVersion) `
            ('"version": "{0}"' -f $newVersion)
          Update-Version 'src-tauri/tauri.conf.json' `
            ('"version": "{0}"' -f $currentVersion) `
            ('"version": "{0}"' -f $newVersion)
          Update-Version 'src-tauri/Cargo.toml' `
            ('version = "{0}"' -f $currentVersion) `
            ('version = "{0}"' -f $newVersion)
          Update-Version 'README.md' `
            ("version-$currentVersion-blue") `
            ("version-$newVersion-blue")
          Update-Version 'README.en.md' `
            ("version-$currentVersion-blue") `
            ("version-$newVersion-blue")

          "version=$newVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tag=v$newVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          Write-Host "Version: $currentVersion -> $newVersion"

      - name: Build Windows release
        run: pnpm tauri build --bundles nsis

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'marklite-release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          Copy-Item -LiteralPath 'src-tauri/target/release/marklite.exe' `
            -Destination (Join-Path $releaseDir "MarkLite-v$env:VERSION-windows-x64-portable.exe")

          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName `
            -Destination (Join-Path $releaseDir "MarkLite-v$env:VERSION-windows-x64-setup.exe")

      - name: Commit version and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json README.md README.en.md src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git diff --cached --check
          git commit -m "🔖 chore: 发布 $env:TAG 预发行版"
          git tag -a $env:TAG -m "MarkLite $env:TAG"
          git push --atomic origin 'HEAD:refs/heads/main' "refs/tags/$env:TAG"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'marklite-release') -File)
          if ($assets.Count -ne 2) {
            throw "Expected two release assets, found $($assets.Count)."
          }

          & gh release create $env:TAG @($assets.FullName) `
            --repo $env:GITHUB_REPOSITORY `
            --title "MarkLite $env:TAG" `
            --generate-notes `
            --prerelease `
            --latest=false `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub pre-release $env:TAG."
          }

  notify:
    name: Notify Feishu
    needs: [verify, release]
    if: >-
      always() &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Send workflow result
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          UPSTREAM_RUN_URL: ${{ github.event.workflow_run.html_url }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FEISHU_WEBHOOK_URL) -or
              [string]::IsNullOrWhiteSpace($env:FEISHU_WEBHOOK_SECRET)) {
            throw 'Feishu secrets are not configured. Set FEISHU_WEBHOOK_URL and FEISHU_WEBHOOK_SECRET in GitHub Secrets.'
          }

          if ($env:UPSTREAM_CONCLUSION -eq 'success' -and $env:RELEASE_RESULT -eq 'success') {
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
              throw 'Release tag is missing from the successful release job.'
            }
            $headerTemplate = 'green'
            $title = 'MarkLite 预发行版成功'
            $summary = "CI 已通过，Windows 预发行版 **$env:RELEASE_TAG** 已构建并发布。`n`n提交：$env:COMMIT_SHA"
            $assetBaseUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
            $actions = @(
              @{
                tag = 'button'
                text = @{ tag = 'plain_text'; content = '下载便携版' }
                type = 'primary'
                url = "$assetBaseUrl/MarkLite-$env:RELEASE_TAG-windows-x64-portable.exe"
              }
              @{
                tag = 'button'
                text = @{ tag = 'plain_text'; content = '下载安装包' }
                type = 'default'
                url = "$assetBaseUrl/MarkLite-$env:RELEASE_TAG-windows-x64-setup.exe"
              }
            )
          } elseif ($env:UPSTREAM_CONCLUSION -eq 'cancelled' -or $env:RELEASE_RESULT -eq 'cancelled') {
            $headerTemplate = 'orange'
            $title = 'MarkLite 预发行版已取消'
            $summary = "CI 或发行版工作流被取消，未完成预发行。`n`n提交：$env:COMMIT_SHA"
            $actions = @(
              @{
                tag = 'button'
                text = @{ tag = 'plain_text'; content = '查看工作流' }
                type = 'default'
                url = $env:RELEASE_RUN_URL
              }
            )
          } elseif ($env:UPSTREAM_CONCLUSION -ne 'success') {
            $headerTemplate = 'red'
            $title = 'MarkLite 预发行版失败'
            $summary = "CI 未通过（$env:UPSTREAM_CONCLUSION），发行版未构建。`n`n提交：$env:COMMIT_SHA"
            $actions = @(
              @{
                tag = 'button'
                text = @{ tag = 'plain_text'; content = '查看 CI 工作流' }
                type = 'primary'
                url = $env:UPSTREAM_RUN_URL
              }
            )
          } else {
            $headerTemplate = 'red'
            $title = 'MarkLite 预发行版失败'
            $summary = "CI 已通过，但发行版工作流失败（verify=$env:VERIFY_RESULT, release=$env:RELEASE_RESULT）。`n`n提交：$env:COMMIT_SHA"
            $actions = @(
              @{
                tag = 'button'
                text = @{ tag = 'plain_text'; content = '查看发行工作流' }
                type = 'primary'
                url = $env:RELEASE_RUN_URL
              }
            )
          }

          $timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $stringToSign = "$timestamp`n$env:FEISHU_WEBHOOK_SECRET"
          $hmac = [System.Security.Cryptography.HMACSHA256]::new(
            [System.Text.Encoding]::UTF8.GetBytes($stringToSign)
          )
          try {
            $sign = [Convert]::ToBase64String(
              $hmac.ComputeHash([byte[]]::new(0))
            )
          } finally {
            $hmac.Dispose()
          }

          $card = @{
            config = @{ wide_screen_mode = $true }
            header = @{
              template = $headerTemplate
              title = @{ tag = 'plain_text'; content = $title }
            }
            elements = @(
              @{
                tag = 'div'
                text = @{ tag = 'lark_md'; content = $summary }
              }
              @{
                tag = 'action'
                actions = $actions
              }
            )
          }

          $payload = @{
            timestamp = $timestamp
            sign = $sign
            msg_type = 'interactive'
            card = $card
          } | ConvertTo-Json -Compress -Depth 10

          $response = Invoke-RestMethod `
            -Uri $env:FEISHU_WEBHOOK_URL `
            -Method Post `
            -ContentType 'application/json; charset=utf-8' `
            -Body $payload

          if ($null -ne $response.code -and [int]$response.code -ne 0) {
            throw "Feishu webhook rejected the notification (code $($response.code))."
          }
