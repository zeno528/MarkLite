name: CI

on:
  push:
    branches: [main]
    # Only application and build inputs should start the release-capable CI.
    paths:
      - '.npmrc'
      - 'index.html'
      - 'lingui.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/tauri.svg'
      - 'public/vite.svg'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '.npmrc'
      - 'index.html'
      - 'lingui.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/tauri.svg'
      - 'public/vite.svg'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
